[package]
name = "tethertone-desktop"
version = "0.1.0"
description = "Tethertone for Windows and Linux: your computer's audio on your Android phone, and back."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tethertone"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
gethostname = "1.1.0"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tethertone-core = { path = "../core" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target."cfg(windows)".dependencies]
tray-icon = "0.24.2"

[features]
# The window. Without it the binary is headless only (servers, CI).
default = ["gui"]
gui = ["dep:eframe"]

# `cargo deb` — the Linux package.
[package.metadata.deb]
name = "tethertone"
maintainer = "Tethertone contributors <noreply@github.com>"
copyright = "2026, Tethertone contributors"
extended-description = """Streams this computer's audio to the Tethertone Android app over USB or \
Wi-Fi, and plays the phone's microphone or audio back. Uses PulseAudio or PipeWire."""
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/tethertone", "usr/bin/", "755"],
    ["assets/tethertone.desktop", "usr/share/applications/", "644"],
    ["assets/tethertone.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
