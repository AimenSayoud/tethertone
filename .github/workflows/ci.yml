name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, ad-hoc signed)
        working-directory: macos
        run: ./build.sh --universal
      - name: Protocol self-test
        working-directory: macos
        run: ./Tethertone.app/Contents/MacOS/Tethertone --selftest
      - name: End to end, both directions (headless server + probe.py)
        working-directory: macos
        run: |
          ./Tethertone.app/Contents/MacOS/Tethertone --headless --test-tone > server.log 2>&1 &
          sleep 3
          python3 ../tools/probe.py --seconds 5 --up-tone
          kill %1 || true
          cat server.log

  android:
    name: Android app and shared module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew :shared:jvmTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: android/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  probe:
    name: probe.py against the shared vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py --selftest

  desktop-linux:
    name: Windows/Linux app (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (PulseAudio client, windowing)
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Lint
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (protocol vectors, jitter buffer, server end to end)
        working-directory: desktop
        run: cargo test
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: End to end, both directions (headless server + probe.py)
        run: |
          desktop/target/release/tethertone --headless --test-tone --no-usb > server.log 2>&1 &
          sleep 2
          python3 tools/probe.py --seconds 5 --up-tone
          kill %1 || true
          cat server.log

  desktop-windows:
    name: Windows/Linux app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Lint
        working-directory: desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: desktop
        run: cargo test
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: End to end, both directions (headless server + probe.py)
        shell: bash
        run: |
          desktop/target/release/tethertone.exe --headless --test-tone --no-usb > server.log 2>&1 &
          sleep 3
          python tools/probe.py --seconds 5 --up-tone
          kill %1 || true
          cat server.log
      - uses: actions/upload-artifact@v4
        with:
          name: tethertone-windows
          path: desktop/target/release/tethertone.exe

